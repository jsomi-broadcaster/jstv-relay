listen 1935;
max_connections 1000;
http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}
vhost __defaultVhost__ {
    rtc {
        enabled on;
        rtc_to_rtmp on;
    }
    publish {
        # When your app publishes, SRS runs ffmpeg to push to both
    }
    exec {
        enabled on;
        # This is the RTMP push - SRS runs this automatically
        publish ./objs/ffmpeg/bin/ffmpeg -re -i rtmp://127.0.0.1:1935/live/jstv -c copy -f flv rtmp://a.rtmp.youtube.com/live2/__YT_KEY__ -c copy -f flv rtmps://live-api-s.facebook.com:443/rtmp/__FB_KEY__;
    }
}
